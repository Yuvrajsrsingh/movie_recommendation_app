<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Recommendation</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Dark mode styles */
      body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: "Roboto", sans-serif;
        min-height: 100vh;
      }

      h1,
      h3 {
        color: #bb86fc;
      }

      .container {
        margin-top: 50px;
        margin-bottom: 50px;
      }

      .form-group label {
        color: #b0bec5;
      }

      select {
        background-color: #333333 !important;
        color: #ffffff !important;
        border: 1px solid #bb86fc !important;
      }

      select:focus {
        box-shadow: 0 0 0 0.2rem rgba(187, 134, 252, 0.25) !important;
      }

      #recommendBtn {
        background-color: #bb86fc;
        border: none;
        padding: 10px 24px;
        font-weight: 500;
        color: #121212;
        transition: all 0.3s ease-in-out;
      }

      #recommendBtn:hover {
        background-color: #9955e8;
        color: #ffffff;
        transform: scale(1.03);
      }

      #trailerModalLabel {
        color: #121212;
      }

      #recommendation .card {
        background-color: #1e1e1e;
        color: #ffffff;
        border: 1px solid #2d2d2d;
        transition: transform 0.3s, box-shadow 0.3s;
      }

      #recommendation .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      }

      .movie-poster {
        height: 380px;
        object-fit: cover;
        background-color: #2a2a2a;
      }

      .card-title {
        color: #bb86fc;
        font-size: 1.15rem;
      }

      .card-text {
        color: #b0bec5;
        font-size: 0.9rem;
      }

      .spinner-border {
        color: #bb86fc;
      }

      .iframe-container {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
        height: 0;
        overflow: hidden;
        background-color: black;
      }

      .iframe-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }

      .overview-text {
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 class="text-center font-weight-bold mb-4">🎬 Movie Recommendation System</h1>

      <!-- Alert / Status message container -->
      <div id="alertContainer"></div>

      <div class="form-group">
        <label for="genreSelect">Select Genre:</label>
        <select class="form-control" id="genreSelect">
          <option value="">-- Choose a Genre --</option>
        </select>
      </div>

      <button type="button" class="btn btn-primary" id="recommendBtn">
        Get Movie Recommendations
      </button>

      <!-- Movie grid layout -->
      <div id="loader" class="mt-4 text-center" style="display: none">
        <div class="spinner-border" role="status">
          <span class="sr-only">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Fetching movies & trailers...</p>
      </div>

      <div id="recommendation" class="mt-4 row"></div>
    </div>

    <!-- Trailer Modal -->
    <div
      class="modal fade"
      id="trailerModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="trailerModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content bg-dark text-white">
          <div class="modal-header border-secondary">
            <h5 class="modal-title text-white" id="trailerModalLabel">Movie Trailer</h5>
            <button
              type="button"
              class="close text-white"
              data-dismiss="modal"
              aria-label="Close"
            >
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body p-0" id="trailerModalBody">
            <div class="iframe-container">
              <!-- Trailer iframe will be injected here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
